# Force Gradle to use JDK 17 (Double backslashes required for Windows paths)
org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-17.0.20.8-hotspot

# JVM arguments compatible with JDK 17
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC --add-opens=java.base/java.lang=ALL-UNNAMED

# Build optimizations
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.parallel=true

# Expo & React Native settings
systemProp.EXPO_ROUTER_DISABLE_RN_NAVIGATION_CHECK=1
android.suppressUnsupportedCompileSdk=35
android.useAndroidX=true
android.enablePngCrunchInReleaseBuilds=true
android.enableMinifyInReleaseBuilds=true
android.enableShrinkResourcesInReleaseBuilds=true

reactNativeArchitectures=arm64-v8a
newArchEnabled=true
hermesEnabled=true
edgeToEdgeEnabled=true

expo.gif.enabled=true
expo.webp.enabled=true
expo.webp.animated=false
EX_DEV_CLIENT_NETWORK_INSPECTOR=true
expo.useLegacyPackaging=false
expo.inlineModules.watchedDirectories=[]